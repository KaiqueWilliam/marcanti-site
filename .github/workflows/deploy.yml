name: Deploy para HostGator

# Roda automaticamente a cada push na main (exceto quando só mexe em
# documentação, que não faz parte do site publicado). Também pode ser
# disparado manualmente na aba Actions do GitHub, útil para testar.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "AUDITORIA-PROGRESSO.md"
      - ".github/**"
  workflow_dispatch:

# Evita duas publicações rodando ao mesmo tempo (ex.: dois pushes seguidos).
concurrency:
  group: deploy-hostgator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar pt/ en/ es/ (node build/build.js)
        run: node build/build.js

      - name: Configurar ssh-agent com a chave (destrava a senha uma vez)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Script "askpass": quando o ssh-add pedir a senha da chave, ele
          # chama esse script em vez de tentar abrir um terminal (que não
          # existe no runner). printf em vez de heredoc pra não arriscar
          # indentação quebrando o shebang da primeira linha.
          printf '#!/bin/sh\necho "$SSH_KEY_PASSPHRASE"\n' > /tmp/askpass.sh
          chmod +x /tmp/askpass.sh

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          # SSH_ASKPASS_REQUIRE=force obriga o ssh-add a usar o script acima
          # em vez de tentar abrir um prompt de terminal (testado localmente).
          SSH_ASKPASS=/tmp/askpass.sh SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/deploy_key < /dev/null
          ssh-add -l

      - name: Publicar via rsync/SSH na HostGator
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ vars.SSH_PORT || 22 }}
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
        run: |
          rsync -avzr \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new" \
            --exclude='.git/' --exclude='.git*' --exclude='.github/' \
            --exclude='node_modules/' --exclude='build/' \
            --exclude='backup-imagens/' --exclude='backup-imagens.zip' \
            --exclude='*.zip' --exclude='README.md' \
            --exclude='AUDITORIA-PROGRESSO.md' --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ "$SSH_USERNAME@$SSH_HOST:$REMOTE_DIR"
          # Sem --delete de propósito: sobe/atualiza arquivos, mas não apaga
          # nada que já esteja no servidor e não esteja no repo (mais seguro
          # pra começar). Depois de validar algumas rodadas, dá pra adicionar
          # --delete acima se quiser espelho exato.

      - name: Limpar chave SSH e agente
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key /tmp/askpass.sh
          ssh-agent -k || true
