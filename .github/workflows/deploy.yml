name: Deploy para HostGator

# Roda automaticamente a cada push na main (exceto quando só mexe em
# documentação, que não faz parte do site publicado). Também pode ser
# disparado manualmente na aba Actions do GitHub, útil para testar.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "AUDITORIA-PROGRESSO.md"
      - ".github/**"
  workflow_dispatch:

# Evita duas publicações rodando ao mesmo tempo (ex.: dois pushes seguidos).
concurrency:
  group: deploy-hostgator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar pt/ en/ es/ (node build/build.js)
        run: node build/build.js

      - name: Configurar chave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: "Diagnóstico: chave pública correspondente à privada salva"
        run: |
          echo "Compare esta chave pública com a que está 'authorized' no cPanel:"
          ssh-keygen -y -f ~/.ssh/deploy_key || echo "FALHOU AO LER A CHAVE — arquivo corrompido/mal formatado."
          echo "Fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key

      - name: Publicar via rsync/SSH na HostGator
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ vars.SSH_PORT || 22 }}
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
        run: |
          rsync -avzr \
            -e "ssh -v -p $SSH_PORT -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            --exclude='.git/' --exclude='.git*' --exclude='.github/' \
            --exclude='node_modules/' --exclude='build/' \
            --exclude='backup-imagens/' --exclude='backup-imagens.zip' \
            --exclude='*.zip' --exclude='README.md' \
            --exclude='AUDITORIA-PROGRESSO.md' --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ "$SSH_USERNAME@$SSH_HOST:$REMOTE_DIR"
          # Sem --delete de propósito: sobe/atualiza arquivos, mas não apaga
          # nada que já esteja no servidor e não esteja no repo (mais seguro
          # pra começar). Depois de validar algumas rodadas, dá pra adicionar
          # --delete acima se quiser espelho exato.

      - name: Limpar chave SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
